# Publishes this n8n community node package to npm on every version tag push
# (v*.*.*, matching this repo's existing tag convention).
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. Provenance lets anyone
# cryptographically verify that a package was built by this exact workflow,
# from this exact repository and commit.
#
# ─── ONE-TIME SETUP (required before the first tag push) ──────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. On npmjs.com, open n8n-nodes-keephub's package settings.
#   2. Under "Publish access" → "Trusted Publishers", add a publisher:
#        Repository owner: RetailInTouch
#        Repository name:  n8n-nodes-keephub
#        Workflow name:    publish.yml
#        Environment:      (leave blank)
#   3. Leave the NPM_TOKEN secret unset — GitHub's OIDC token is used instead.
#
# Option B — npm Automation Token (fallback):
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access
#      Token, scoped to this package with "Read and write" publish permission.
#   2. In GitHub repo settings → Secrets and variables → Actions, add a
#      secret named NPM_TOKEN with that value.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Bump the version in package.json, commit, then:
#   git tag v<version>
#   git push origin v<version>
# The tag push triggers this workflow, which lints, builds, and publishes
# with provenance via `npm run release` (auto-detected as running in CI).

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Upgrade npm
        # npm's OIDC Trusted Publishing exchange requires npm >=11.5.1. Node 22's
        # bundled npm (10.9.x as of writing) predates it, silently skipping OIDC
        # and publishing unauthenticated instead of erroring loudly.
        run: npm install -g npm@latest

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # Lint and build run automatically as part of the release process.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
